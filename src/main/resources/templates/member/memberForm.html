<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout1}">

<!-- 사용자 CSS 추가 -->
<th:block layout:fragment="css">
    <style>
        body {
            background-color: #fafafa;
            font-family: 'Pretendard', sans-serif;
        }

        .signup-container {
            max-width: 500px;
            margin: 80px auto;
            padding: 40px;
            background-color: #fff;
            border: 1px solid #eaeaea;
        }

        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            color: #111;
        }

        .sub-title {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #222;
        }

        .form-control {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: #111;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        .fieldError {
            color: #e53935;
            font-size: 13px;
            margin-top: 5px;
        }

        .signup-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 6px;
            background-color: #111;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .signup-btn:hover {
            background-color: #333;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</th:block>

<!-- 사용자 스크립트 추가 -->
<th:block layout:fragment="script">

    <script th:inline="javascript">
        $(document).ready(function(){
            var errorMessage = [[${errorMessage}]];
            if(errorMessage != null){
                alert(errorMessage);
            }
        });
    </script>

</th:block>

<div layout:fragment="content">

    <div class="signup-container">

        <div class="logo">FASHION MALL</div>

        <div class="sub-title">
            나만의 스타일을 시작해보세요.
        </div>

        <form action="/members/new"
              method="post"
              th:object="${memberFormDto}">

            <div class="form-group">
                <label th:for="name">이름</label>
                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       placeholder="이름을 입력해주세요">

                <p th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"
                   class="fieldError">
                </p>
            </div>

            <div class="form-group">
                <label th:for="email">이메일</label>
                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       placeholder="example@email.com">

                <p th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"
                   class="fieldError">
                </p>
            </div>

            <div class="form-group">
                <label th:for="password">비밀번호</label>
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       placeholder="비밀번호를 입력해주세요">

                <p th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"
                   class="fieldError">
                </p>
            </div>

            <div class="form-group">
                <label th:for="address">주소</label>
                <input type="text"
                       th:field="*{address}"
                       class="form-control"
                       placeholder="주소를 입력해주세요">

                <p th:if="${#fields.hasErrors('address')}"
                   th:errors="*{address}"
                   class="fieldError">
                </p>
            </div>

            <button type="submit" class="signup-btn">
                Mall 시작하기
            </button>

            <div class="login-link">
                이미 회원이신가요?
                <a th:href="@{/members/login}">
                    로그인
                </a>
            </div>

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
        </form>

    </div>

</div>

</html>
