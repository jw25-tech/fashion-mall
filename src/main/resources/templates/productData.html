<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>상품 데이터 출력</h1>
    <div>
        상품명: <span th:text="${productDto.productName}"></span>
    </div>
    <div>
        상품설명: <span th:text="${productDto.description}"></span>
    </div>
    <div>
        상품등록일: <span th:text="${productDto.regTime}"></span>
    </div>
    <div>
        상품가격: <span th:text="${productDto.price}"></span>
    </div>
</body>
</html>
